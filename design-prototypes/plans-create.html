<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新建检修计划 - 仪表阀门智能管理系统</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../static/css/base.css">
  <link rel="stylesheet" href="../static/css/components.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-brand"><i class="bi bi-gear-fill"></i><span>仪表阀门台账</span></div>
    <div class="sidebar-menu">
      <a href="#" class="sidebar-menu-item"><i class="bi bi-house-door"></i><span>首页</span></a>
      <a href="#" class="sidebar-menu-item"><i class="bi bi-collection"></i><span>全部台账</span></a>
      <a href="plans-leader-list.html" class="sidebar-menu-item active"><i class="bi bi-calendar-check"></i><span>检修计划</span></a>
      <a href="#" class="sidebar-menu-item"><i class="bi bi-check-circle"></i><span>审批中心</span><span class="badge bg-danger ms-auto">3</span></a>
      <a href="#" class="sidebar-menu-item"><i class="bi bi-bar-chart-fill"></i><span>数据统计</span></a>
      <a href="#" class="sidebar-menu-item"><i class="bi bi-wrench"></i><span>维护记录</span></a>
    </div>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">L</div>
        <div class="user-details">
          <p class="user-name">张领导</p>
          <p class="user-role">领导</p>
        </div>
      </div>
      <a href="#" class="logout-btn"><i class="bi bi-box-arrow-right"></i> 退出登录</a>
    </div>
  </div>

  <div class="main-content">
    <div class="main-header">
      <div class="header-title-group">
        <a href="plans-leader-list.html" class="btn-back-header"><i class="bi bi-arrow-left"></i> 返回</a>
        <h1 class="page-title">新建检修计划</h1>
      </div>
    </div>

    <div class="main-body" style="padding: 24px 3px;">
      <div style="max-width: 900px; margin: 0 auto;">

        <!-- 第一步：基本信息 -->
        <div class="cmp-form-section">
          <div class="cmp-form-section__header">
            <i class="bi bi-info-circle"></i>
            <h5>基本信息</h5>
          </div>
          <div class="cmp-form-section__body">
            <div class="cmp-field-row">
              <div class="cmp-field">
                <label class="cmp-label"><span class="required">*</span> 计划标题</label>
                <input type="text" class="cmp-input" placeholder="例如：2026年度大检修计划" value="">
              </div>
            </div>
            <div class="cmp-field-row">
              <div class="cmp-field">
                <label class="cmp-label">计划描述</label>
                <textarea class="cmp-input" rows="4" placeholder="描述本次检修的范围、目的等"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- 第二步：选择阀门（添加计划项） -->
        <div class="cmp-form-section">
          <div class="cmp-form-section__header">
            <i class="bi bi-valve"></i>
            <h5>计划阀门 <span style="font-size: 12px; opacity: 0.8;">（从已审批台账中选择）</span></h5>
          </div>
          <div class="cmp-form-section__body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <span style="font-size: 14px; color: var(--color-text-muted);">已选择 <strong style="color: var(--color-primary);">0</strong> 个阀门</span>
              <button class="cmp-btn cmp-btn--primary cmp-btn--sm" data-bs-toggle="modal" data-bs-target="#addValveModal">
                <i class="bi bi-plus-lg"></i> 从台账选择
              </button>
            </div>

            <!-- 空状态 -->
            <div class="cmp-empty" style="padding: 40px 20px;">
              <i class="bi bi-inbox"></i>
              <p>尚未添加阀门，请点击上方按钮从已审批台中选择</p>
            </div>
          </div>
        </div>

        <!-- 提交按钮 -->
        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <a href="plans-leader-list.html" class="cmp-btn cmp-btn--secondary">取消</a>
          <button class="cmp-btn cmp-btn--primary" disabled style="opacity: 0.5;"><i class="bi bi-save"></i> 保存为草稿</button>
          <button class="cmp-btn" style="background: var(--mode-color); color: white;" disabled><i class="bi bi-send"></i> 发布计划</button>
        </div>

      </div>
    </div>
  </div>

  <!-- 添加阀门 弹窗（同计划详情页） -->
  <div class="modal fade" id="addValveModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content" style="border-radius: 12px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.2);">
        <div class="modal-header" style="border-bottom: 1px solid #f1f5f9; padding: 20px 24px;">
          <h5 class="modal-title" style="font-size: 18px; font-weight: 600; color: #1e293b; margin: 0;">
            <i class="bi bi-plus-circle me-2" style="color: var(--mode-color);"></i>从台账中选择阀门
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" style="opacity: 0.5;"></button>
        </div>
        <div class="modal-body" style="padding: 20px 24px;">
          <div class="row g-2 mb-3">
            <div class="col-md-5">
              <div class="input-group">
                <span class="input-group-text" style="background: #f8fafc; border-right: none;"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control" placeholder="搜索位号、名称..." style="border-left: none;">
              </div>
            </div>
            <div class="col-md-3">
              <select class="cmp-select" style="height: 38px;">
                <option value="">全部装置</option>
                <option>常减压装置</option>
                <option>催化裂化装置</option>
                <option>重整装置</option>
                <option>公用工程</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="cmp-select" style="height: 38px;">
                <option value="">全部类型</option>
                <option>调节阀</option>
                <option>开关阀</option>
                <option>电动阀</option>
              </select>
            </div>
            <div class="col-md-2" style="display: flex; align-items: center;">
              <span class="text-muted" style="font-size: 14px;">已选 <strong style="color: var(--color-primary);">0</strong> 项</span>
            </div>
          </div>

          <div style="max-height: 300px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
            <table class="cmp-table" style="margin: 0;">
              <thead>
                <tr>
                  <th style="width: 40px;" class="cmp-table__th"><input type="checkbox" class="form-check-input"></th>
                  <th class="cmp-table__th">位号</th>
                  <th class="cmp-table__th">设备名称</th>
                  <th class="cmp-table__th">装置名称</th>
                  <th class="cmp-table__th">类型</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="cmp-table__td"><input type="checkbox" class="form-check-input"></td>
                  <td class="cmp-table__td" style="font-weight: 500; color: var(--color-primary);">FV-101</td>
                  <td class="cmp-table__td">进料调节阀</td>
                  <td class="cmp-table__td">常减压装置</td>
                  <td class="cmp-table__td">调节阀</td>
                </tr>
                <tr>
                  <td class="cmp-table__td"><input type="checkbox" class="form-check-input"></td>
                  <td class="cmp-table__td" style="font-weight: 500; color: var(--color-primary);">FV-102</td>
                  <td class="cmp-table__td">蒸汽流量调节阀</td>
                  <td class="cmp-table__td">常减压装置</td>
                  <td class="cmp-table__td">调节阀</td>
                </tr>
                <tr>
                  <td class="cmp-table__td"><input type="checkbox" class="form-check-input"></td>
                  <td class="cmp-table__td" style="font-weight: 500; color: var(--color-primary);">XV-301</td>
                  <td class="cmp-table__td">紧急切断阀</td>
                  <td class="cmp-table__td">重整装置</td>
                  <td class="cmp-table__td">开关阀</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="mt-3" style="border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 12px 16px; background: #fafbfc;">
            <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;"><i class="bi bi-calendar-range me-1"></i>批量设置计划日期</div>
            <div class="row g-2">
              <div class="col-md-4">
                <label style="font-size: 12px; color: var(--color-text-muted);">计划开始日期</label>
                <input type="date" class="form-control form-control-sm" style="font-size: 13px;">
              </div>
              <div class="col-md-4">
                <label style="font-size: 12px; color: var(--color-text-muted);">计划截止日期</label>
                <input type="date" class="form-control form-control-sm" style="font-size: 13px;">
              </div>
              <div class="col-md-4 d-flex align-items-end">
                <button class="cmp-toolbar-btn cmp-toolbar-btn--primary btn-sm"><i class="bi bi-arrow-right"></i> 应用到已选项</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="border-top: 1px solid #f1f5f9; padding: 16px 24px;">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="background: #f1f5f9; border: none; color: #475569; padding: 10px 20px; border-radius: 8px;">取消</button>
          <button type="button" class="btn cmp-btn cmp-btn--primary" data-bs-dismiss="modal" style="padding: 10px 20px; border-radius: 8px;"><i class="bi bi-check-lg"></i> 确认添加</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
