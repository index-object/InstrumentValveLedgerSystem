<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新建维护记录 - 仪表阀门智能管理系统</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../static/css/base.css">
  <link rel="stylesheet" href="../static/css/components.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-brand"><i class="bi bi-gear-fill"></i><span>仪表阀门台账</span></div>
    <div class="sidebar-menu">
      <a href="#" class="sidebar-menu-item active"><i class="bi bi-house-door"></i><span>首页</span></a>
      <a href="#" class="sidebar-menu-item"><i class="bi bi-journal-text"></i><span>我的台账</span></a>
      <a href="plans-employee-list.html" class="sidebar-menu-item"><i class="bi bi-calendar-check"></i><span>检修计划</span></a>
      <a href="plans-employee-early-warning.html" class="sidebar-menu-item"><i class="bi bi-exclamation-triangle"></i><span>检修预警</span><span class="badge bg-danger ms-auto">5</span></a>
      <a href="#" class="sidebar-menu-item"><i class="bi bi-wrench"></i><span>维护记录</span></a>
    </div>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">王</div>
        <div class="user-details">
          <p class="user-name">王工</p>
          <p class="user-role">员工</p>
        </div>
      </div>
      <a href="#" class="logout-btn"><i class="bi bi-box-arrow-right"></i> 退出登录</a>
    </div>
  </div>

  <div class="main-content">
    <div class="main-header">
      <div class="header-title-group">
        <a href="plans-employee-early-warning.html" class="btn-back-header"><i class="bi bi-arrow-left"></i> 返回</a>
        <h1 class="page-title">新建维护记录</h1>
      </div>
    </div>

    <div class="main-body" style="padding: 24px 3px;">
      <div style="max-width: 800px; margin: 0 auto;">
        <div class="cmp-card">
          <div style="padding: 16px 24px; border-bottom: 1px solid var(--color-border);">
            <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px;">
              <i class="bi bi-tools" style="color: var(--mode-color);"></i> 填写检修记录
            </div>
          </div>
          <div style="padding: 24px;">
            <form>
              <!-- 从预警跳转过来的，位号已预填 -->
              <div class="cmp-alert cmp-alert--info" style="margin-bottom: 20px;">
                <i class="bi bi-info-circle"></i>
                <span>您正在为计划项 <strong>XV-301 紧急切断阀</strong> 创建维护记录，所属计划：<strong>2026年度大检修计划</strong></span>
                <input type="hidden" name="plan_item_id" value="1">
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="cmp-label" style="font-weight: 500;"><span class="required">*</span> 设备位号</label>
                  <input type="text" class="cmp-input" value="XV-301" readonly style="background: #f1f5f9; cursor: not-allowed;">
                  <input type="hidden" name="valve_id" value="301">
                  <input type="hidden" name="valve_type" value="control_valve">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="cmp-label" style="font-weight: 500;">设备名称</label>
                  <input type="text" class="cmp-input" value="紧急切断阀" readonly style="background: #f1f5f9; cursor: not-allowed;">
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="cmp-label" style="font-weight: 500;">装置名称</label>
                  <input type="text" class="cmp-input" value="重整装置" readonly style="background: #f1f5f9; cursor: not-allowed;">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="cmp-label" style="font-weight: 500;">类型</label>
                  <select name="类型" class="cmp-input">
                    <option value="维修">维修</option>
                    <option value="检定">检定</option>
                    <option value="保养">保养</option>
                    <option value="校验">校验</option>
                  </select>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="cmp-label" style="font-weight: 500;"><span class="required">*</span> 检修时间</label>
                  <input type="date" name="检修时间" class="cmp-input" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="cmp-label" style="font-weight: 500;"><span class="required">*</span> 检修人员</label>
                  <input type="text" name="检修人员" class="cmp-input" required placeholder="请输入检修人员">
                </div>
              </div>

              <div class="mb-3">
                <label class="cmp-label" style="font-weight: 500;"><span class="required">*</span> 检修内容</label>
                <textarea name="检修内容" class="cmp-input" rows="5" required placeholder="请输入检修内容，如检修步骤、发现的问题、处理结果等"></textarea>
              </div>

              <!-- 关联计划项 -->
              <div class="mb-3" style="border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 16px; background: #fafbfc;">
                <label class="cmp-label" style="margin-bottom: 8px;"><i class="bi bi-link-45deg" style="color: var(--mode-color);"></i> 关联检修计划</label>
                <div style="display: flex; align-items: center; gap: 12px;">
                  <select class="cmp-select" style="width: auto; min-width: 250px; height: 38px;">
                    <option value="">不关联计划（普通维护）</option>
                    <option selected>2026年度大检修计划 - XV-301 紧急切断阀</option>
                    <option>2026年度大检修计划 - FV-105 进料调节阀</option>
                    <option>2026年第二季度仪表校验 - PT-201 压力变送器</option>
                  </select>
                  <span style="font-size: 12px; color: var(--color-text-muted);">
                    <i class="bi bi-check-circle-fill" style="color: #10b981;"></i> 关联后自动推进计划进度
                  </span>
                </div>
              </div>

              <div class="d-flex gap-2" style="margin-top: 24px;">
                <button type="submit" class="cmp-btn cmp-btn--primary"><i class="bi bi-check-lg"></i> 保存</button>
                <a href="plans-employee-early-warning.html" class="cmp-btn cmp-btn--secondary">取消</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
