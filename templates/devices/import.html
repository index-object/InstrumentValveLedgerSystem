{% extends "base.html" %}
{% block page_title %}导入{{ config.name }}{% endblock %}
{% block back_btn %}
<a href="{{ url_for('devices.list', type_code=config.code) }}" class="btn-back-header" title="返回列表">
  <i class="bi bi-arrow-left"></i>
</a>
{% endblock %}
{% block header_actions %}{% endblock %}
{% block content %}
<div class="modern-card" style="max-width: 600px; margin: 0 auto;">
  <div class="p-4">
    <div class="text-center mb-4">
      <div style="width: 72px; height: 72px; background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
        <i class="bi bi-upload" style="font-size: 32px; color: #3b82f6;"></i>
      </div>
      <h5 style="font-weight: 600;">导入{{ config.name }}</h5>
      <p class="text-muted" style="font-size: 14px;">选择 Excel 文件导入{{ config.name }}数据</p>
    </div>

    <form method="POST" enctype="multipart/form-data">
      <div class="mb-4">
        <label class="form-label">选择 Excel 文件</label>
        <input type="file" name="file" class="form-control form-control-modern" accept=".xlsx,.xls" required style="padding: 8px 12px;">
      </div>
      <div class="d-flex gap-2 justify-content-center">
        <button type="submit" class="btn-submit">
          <i class="bi bi-upload"></i> 导入
        </button>
        <a href="{{ url_for('devices.list', type_code=config.code) }}" class="btn-back">
          <i class="bi bi-x"></i> 取消
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
