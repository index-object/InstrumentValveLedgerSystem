{% extends "base.html" %}
{% block title %}导入{{ config.name }}{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="fa fa-upload"></i> 导入{{ config.name }}</h4>
    <a href="{{ url_for('devices.list', type_code=config.code) }}" class="btn btn-secondary btn-sm">
      <i class="fa fa-arrow-left"></i> 返回列表
    </a>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
          <label>选择 Excel 文件</label>
          <input type="file" name="file" class="form-control-file" accept=".xlsx,.xls" required>
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="fa fa-upload"></i> 导入
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
